[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-ledger-api"
version = "0.1.0"
description = "Local Event Ledger API for financial transaction events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
]

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --assert=plain"
